# SupermarketBilling — development environment.
# Values come from .env (create it with scripts/setup-dev.ps1; never commit it).
#
#   docker compose up -d db                      live/operational database only
#   docker compose --profile archive up -d       also start the separate archive database
#
# Ports bind to 127.0.0.1 only. Billing counters on the LAN talk to the API, never to the database.

name: supermarketbilling

services:
  db:
    image: postgres:16-alpine
    container_name: supermarketbilling-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SB_DB_NAME:?set in .env}
      POSTGRES_USER: ${SB_DB_SUPERUSER:?set in .env}
      POSTGRES_PASSWORD: ${SB_DB_SUPERUSER_PASSWORD:?set in .env}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8 --data-checksums"
      SB_DB_MIGRATOR_USER: ${SB_DB_MIGRATOR_USER:?set in .env}
      SB_DB_MIGRATOR_PASSWORD: ${SB_DB_MIGRATOR_PASSWORD:?set in .env}
      SB_DB_APP_USER: ${SB_DB_APP_USER:?set in .env}
      SB_DB_APP_PASSWORD: ${SB_DB_APP_PASSWORD:?set in .env}
      SB_DB_EXTRA_DATABASES: ${SB_DB_NAME}_test
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:${SB_DB_PORT:-5442}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
    shm_size: 256mb

  # Optional Owner Archive database: separate server, separate volume (use a separate physical disk in production).
  archive-db:
    image: postgres:16-alpine
    container_name: supermarketbilling-archive-db
    profiles: ["archive"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SB_ARCHIVE_DB_NAME:-supermarketbilling_archive}
      POSTGRES_USER: ${SB_DB_SUPERUSER:?set in .env}
      POSTGRES_PASSWORD: ${SB_DB_SUPERUSER_PASSWORD:?set in .env}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8 --data-checksums"
      SB_DB_MIGRATOR_USER: ${SB_DB_MIGRATOR_USER:?set in .env}
      SB_DB_MIGRATOR_PASSWORD: ${SB_DB_MIGRATOR_PASSWORD:?set in .env}
      SB_DB_APP_USER: ${SB_DB_APP_USER:?set in .env}
      SB_DB_APP_PASSWORD: ${SB_DB_APP_PASSWORD:?set in .env}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:${SB_ARCHIVE_DB_PORT:-5443}:5432"
    volumes:
      - archive-db-data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db-data:
    name: supermarketbilling-db-data
  archive-db-data:
    name: supermarketbilling-archive-db-data
